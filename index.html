<style>
:root{--bg:#000;--fg:#fff;--mute:#a0a0a0;--tile:#161616;--tile2:#262626;--tile3:#333;--line:#3a3a3a;--acc:#e6990d;--accfg:#000;--bad:#e51400;--ok:#4caf50;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
body.sun{--bg:#fff;--fg:#000;--mute:#444;--tile:#f1f1f1;--tile2:#e4e4e4;--tile3:#d2d2d2;--line:#b5b5b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
body.sun{font-weight:500}
body.sun .tile .lbl,body.sun .bb button{font-weight:800}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input,textarea,select{font:inherit;font-size:17px}
a{color:inherit}
.scr{padding:calc(var(--sat) + 14px) calc(var(--sar) + 12px) calc(var(--sab) + 100px) calc(var(--sal) + 12px);max-width:960px;margin:0 auto}
.big{font-weight:300;font-size:42px;letter-spacing:-1px;margin:4px 0 14px;line-height:1.05}
.mute{color:var(--mute)}
.small{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:700px){.grid3{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;aspect-ratio:1/1;background:var(--tile2);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;text-align:left;min-height:64px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile.wide{grid-column:span 2;aspect-ratio:2/1}
.tile.acc{background:var(--acc);color:var(--accfg)}
.tile .lbl{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.tile .ico{position:absolute;left:12px;top:12px;width:40px;height:40px}
.tile.wide .ico{width:52px;height:52px}
.tile .cnt{position:absolute;right:12px;top:6px;font-size:40px;font-weight:300}
.tile.ph{padding:0}
.tile.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.ph .cap{position:relative;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.88));padding:26px 9px 7px;color:#fff;font-size:12.5px;font-weight:600;line-height:1.2;max-height:70%;overflow:hidden}
.tile.slot{background:transparent;border:2px dashed var(--line);color:var(--mute)}
.badge{position:absolute;top:6px;right:6px;min-width:30px;height:30px;border-radius:15px;background:var(--acc);color:#000;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:17px;padding:0 8px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.badge.dup{left:6px;right:auto;background:#fff;font-size:12px}
.badge.cov{left:auto;right:6px;top:auto;bottom:6px;background:#ffc928}
.failx{position:absolute;inset:0;background:rgba(229,20,0,.82);color:#fff;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:200}
.proc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--tile)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hdr{display:flex;gap:12px;align-items:center;background:var(--tile);padding:12px;margin:0 0 10px;min-height:72px;text-align:left;width:100%}
.hdr .t{flex:1;min-width:0}
.hdr .a{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr img{height:40px;width:auto;max-width:90px;background:#fff;padding:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.dot.off{background:#999}
.bb{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--tile);border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal);z-index:20}
.bb button{flex:1;min-height:66px;font-size:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.bb button svg{width:26px;height:26px}
.bb button.acc{background:var(--acc);color:var(--accfg)}
.bb button:disabled{opacity:.35}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:12px 18px;background:var(--tile3);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.5px;width:100%;text-align:center}
.btn svg{width:26px;height:26px}
.btn.acc{background:var(--acc);color:var(--accfg)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.sm{min-height:48px;font-size:15px;padding:8px 12px}
.btn.auto{width:auto}
.row{display:flex;gap:8px}
.row>*{flex:1}
.fld{margin:0 0 14px}
.fld label{display:block;font-size:14px;color:var(--mute);margin:0 0 5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.inp{width:100%;min-height:56px;padding:12px 14px;background:var(--tile2);color:var(--fg);border:2px solid transparent;border-radius:0;font-size:18px;-webkit-appearance:none;appearance:none}
.inp:focus{outline:none;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:52px;min-width:60px;padding:8px 14px;background:var(--tile2);font-weight:700;font-size:16px}
.chip.on{background:var(--acc);color:var(--accfg)}
.linkb{color:var(--acc);font-weight:700;min-height:48px;padding:6px 0;font-size:17px}
.brandt{aspect-ratio:auto;min-height:96px;background:#fff;color:#000;justify-content:center;align-items:center;border:4px solid transparent}
.brandt img{max-height:52px;max-width:90%}
.brandt.on{border-color:var(--acc);box-shadow:0 0 0 3px #fff inset}
.brandt .lbl{font-size:12px;margin-top:6px}
.banner{padding:12px 14px;margin:0 0 10px;font-size:15px;background:var(--tile2);border-left:5px solid var(--acc);display:flex;gap:10px;align-items:center}
.banner>div{flex:1}
.banner.bad{border-left-color:var(--bad);background:#3a0d08;color:#fff}
body.sun .banner.bad{background:#ffe1dd;color:#000}
.banner .x{min-width:44px;min-height:44px;font-size:24px}
.pd{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.pd .top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 4px) calc(var(--sar) + 4px) 4px calc(var(--sal) + 4px);background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff}
.pd .top button{min-width:60px;min-height:52px;font-size:16px;font-weight:700;padding:0 10px}
.pd .top button.dots{font-size:28px}
.stage{position:relative;height:58vh;height:58dvh;background:#000;overflow:hidden;touch-action:none;flex:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pd .body{flex:1;overflow-y:auto;padding:10px calc(var(--sar) + 12px) calc(var(--sab) + 84px) calc(var(--sal) + 12px)}
.tagb{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:100%;min-height:62px;padding:8px 14px;background:var(--tile2);margin:0 0 8px;text-align:left}
.tagb small{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute);font-weight:700}
.tagb span{font-size:18px;font-weight:600}
.tagb.empty span{color:var(--acc)}
.prev{font-size:14px;color:var(--mute);margin:8px 0}
.prev b{color:var(--fg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--tile);max-height:92vh;max-height:92dvh;overflow-y:auto;padding:14px calc(var(--sar) + 12px) calc(var(--sab) + 14px) calc(var(--sal) + 12px);-webkit-overflow-scrolling:touch}
.sheet h3{margin:0 0 10px;font-weight:300;font-size:26px}
.sheet .g{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin:14px 0 6px}
.opt{display:block;width:100%;text-align:left;min-height:56px;padding:12px 14px;background:var(--tile2);margin:0 0 4px;font-size:18px}
.opt.on{background:var(--acc);color:var(--accfg)}
.opt.sub{color:var(--mute)}
.opt.red{color:var(--bad)}
.dlg{position:fixed;left:0;right:0;top:28%;background:var(--tile2);z-index:60;padding:20px calc(var(--sar) + 16px) 18px calc(var(--sal) + 16px);box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
.dlg h3{margin:0 0 8px;font-size:24px;font-weight:400}
.dlg p{margin:0 0 16px;color:var(--mute)}
.dlg .btns{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 78px);background:#f2f2f2;color:#000;padding:10px 12px 10px 16px;z-index:70;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.5);min-height:56px}
.toast span{flex:1}
.toast button{min-height:44px;padding:0 14px;background:#000;color:#fff;font-weight:800;text-transform:uppercase;font-size:14px}
.rt{position:relative;aspect-ratio:1/1;background:var(--tile2);overflow:hidden}
.rt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.rt .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85));color:#fff;font-size:11px;font-weight:600;padding:14px 5px 4px 22px;line-height:1.15;max-height:60%;overflow:hidden;pointer-events:none}
.rt .star{position:absolute;left:0;top:0;width:46px;height:46px;font-size:24px;color:#fff;text-shadow:0 0 4px #000}
.rt .star.on{color:#ffc928}
.rt .hand{position:absolute;right:0;top:0;width:46px;height:46px;touch-action:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;text-shadow:0 0 4px #000;background:rgba(0,0,0,.35);cursor:grab}
.rt .num{position:absolute;left:5px;bottom:4px;font-size:11px;color:#fff;font-weight:800;text-shadow:0 0 3px #000;pointer-events:none;z-index:2}
.rt.sel{outline:5px solid var(--acc);outline-offset:-5px}
.rt.sel::after{content:"✓";position:absolute;right:6px;bottom:4px;background:var(--acc);color:#000;font-weight:900;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:14px}
.rt.dragging{opacity:.45;outline:3px dashed var(--acc);outline-offset:-3px}
.filt{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;-webkit-overflow-scrolling:touch}
.filt .chip{flex:none;min-height:46px}
.card{background:var(--tile2);padding:14px;margin:0 0 10px;border-left:6px solid var(--acc)}
.card.block{border-left-color:var(--bad)}
.card.info{border-left-color:#1ba1e2}
.card h4{margin:0 0 6px;font-size:19px}
.card p{margin:0 0 10px;color:var(--mute);font-size:15px}
.bar{height:16px;background:var(--tile3);margin:16px 0}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.file{background:var(--tile2);padding:14px;margin:0 0 10px}
.file .n{font-weight:700;word-break:break-word}
.past{display:flex;align-items:stretch;gap:2px;margin:0 0 6px}
.past>button:first-child{flex:1;text-align:left;background:var(--tile2);padding:12px 14px;min-height:72px}
.past .del{width:64px;background:var(--tile2);font-size:22px}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:60px;background:var(--tile2);padding:8px 14px;margin:0 0 8px;font-size:17px;text-align:left}
.tog i{width:54px;height:30px;border-radius:15px;background:var(--tile3);position:relative;flex:none}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.tog.on i{background:var(--acc)}
.tog.on i::after{left:27px}
.help h3{font-weight:400;font-size:21px;margin:22px 0 6px}
.help p{color:var(--mute);font-size:16px}
.fatal{padding:calc(var(--sat) + 40px) 22px;text-align:left}
.hidden{display:none!important}
</style>
</head>

<div id="layer"></div>

/* ============================ storage (IndexedDB; memory fallback in private mode) ============================ */
function clone(v){ if (v == null || typeof v !== 'object') return v; if (v instanceof Blob) return v; const o = Array.isArray(v) ? [] : {}; for (const k in v) o[k] = clone(v[k]); return o; }
const DB = {
  db:null, mem:null,
  open(){
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no-idb'));
      let r; try { r = indexedDB.open('roofsnap', 1); } catch(e){ return rej(e); }
      r.onupgradeneeded = () => { const d = r.result;
        d.createObjectStore('kv'); d.createObjectStore('insp', {keyPath:'id'});
        d.createObjectStore('photos', {keyPath:'id'}).createIndex('insp', 'inspId'); d.createObjectStore('images'); };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => this.db.close(); res(); };
      r.onerror = () => rej(r.error || new Error('idb-open')); r.onblocked = () => rej(new Error('idb-blocked'));
    });
  },
  useMemory(){ this.db = null; this.mem = {kv:new Map(), insp:new Map(), photos:new Map(), images:new Map()}; },
  _req(store, mode, fn){
    if (this.mem) { try { return Promise.resolve(fn(this.mem[store])); } catch(e){ return Promise.reject(e); } }
    return new Promise((res, rej) => {
      let t, out; try {
        t = this.db.transaction(store, mode); const s = t.objectStore(store);
        const r = fn(s); if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      } catch(e) { try { t && t.abort(); } catch(_){} return rej(e); }
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('aborted'));
    });
  },
  get(st, k){ return this._req(st, 'readonly', s => this.mem ? clone(s.get(k)) : s.get(k)); },
  put(st, v, k){ return this._req(st, 'readwrite', s => { if (this.mem){ s.set(k ?? v.id, clone(v)); return; } return k === undefined ? s.put(v) : s.put(v, k); }); },
  del(st, k){ return this._req(st, 'readwrite', s => { if (this.mem) { s.delete(k); return; } return s.delete(k); }); },
  all(st){ return this._req(st, 'readonly', s => this.mem ? [...s.values()].map(clone) : s.getAll()); },
  byInsp(id){ return this._req('photos', 'readonly', s => this.mem ? [...s.values()].filter(p => p.inspId === id).map(clone) : s.index('insp').getAll(id)); },
  putMany(st, list){ return this._req(st, 'readwrite', s => { list.forEach(v => this.mem ? s.set(v.id, clone(v)) : s.put(v)); }); },
  async estimateBytes(){ let n = 0; (await this.all('images')).forEach(i => { if (i) n += (i.full ? i.full.size : 0) + (i.thumb ? i.thumb.size : 0); }); return n; }
};

function saveInsp(now){ if (!state.insp) return Promise.resolve(); state.insp.updatedAt = Date.now(); clearTimeout(inspTimer);
  const i = state.insp;

const livePhotos = () => state.photos.filter(p => !p.deleted).sort((a,b) => a.order - b.order);

const isDamage = w => !!w && !WHAT_CONTEXT.includes(w);

/* Printed label rule (map 8.4): [Where] — [Count] [What] */
function labelFor(p){
  const where = p.where || '', what = p.what || '';
  let w2 = '';
  if (what) {
    if (what === 'Overview (no damage noted)') w2 = 'overview';
    else w2 = /^[A-Z]{2}/.test(what) ? what : what.charAt(0).toLowerCase() + what.slice(1);
    if (p.count && isDamage(what)) w2 = p.count + ' ' + w2;
  }
  if (where && w2) return `${where} — ${w2}`;
  if (where) return where;
  if (w2) return w2.charAt(0).toUpperCase() + w2.slice(1);
  return '';
}

let toastTimer = null;
function toast(msg, opt={}){
  const old = $('.toast'); if (old) old.remove(); clearTimeout(toastTimer);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (opt.action ? `<button>${esc(opt.action)}</button>` : '');
  if (opt.action) t.querySelector('button').onclick = () => { t.remove(); opt.fn && opt.fn(); };
  document.body.appendChild(t);

}

/* ============================ router (hash; phone Back = one screen back) ============================ */
function go(h, replace){

}

  closeLayer();

    const v = await dialog('Stop building the PDF?', '', [{label:'Stop', value:'stop', cls:'bad'}, {label:'Keep going', value:'keep', cls:'acc'}]);
    if (v === 'stop') state.building.cancel = true; else { location.hash = '#/gen'; return; }

});
/* ============================ rendering ============================ */
const SCREENS = {}, AFTER = {};
function render(){
  if (state.fatal) return;

  if (!state.settings.firstRunDone && r.name !== 'welcome' && r.name !== 'help') return go('#/welcome', true);
  if (['setup','photo','review','ready','gen','done'].includes(r.name) && !state.insp) return go('#/', true);
  if ((r.name === 'gen' && !state.building) || (r.name === 'done' && !state.output)) return go('#/', true);
  const fn = SCREENS[r.name] || SCREENS.home;
  const keepScroll = state.keepScroll; state.keepScroll = false; const y = window.scrollY;
  app.innerHTML = fn(r.arg);

}

function bindStage(id){

async function addFiles(files, opts){

async function processOne(file, rec){

    closeLayer(); go('#/done', true);
  } catch(e) {
    state.building = null; await DB.del('kv', 'building').catch(() => {});
    if (e.cancel) { go('#/', true); toast('PDF stopped — nothing saved'); }
    else {
      console.warn('PDF build failed', e);
      go('#/', true);
      const v = await dialog('Something went wrong building the PDF', 'Your photos are safe.', [{label:'Retry', value:'retry', cls:'acc'}, {label:'Retry with smaller photos', value:'small'}, {label:'Back to photos', value:'back'}]);
      if (v === 'retry') startBuild(opts); else if (v === 'small') startBuild({...opts, startPass:2});
    }
  } finally { try { if (lock) lock.release(); } catch(e) {} }
}
async function buildAll(insp, brand, ready, split, target, startPass, b){
  const plans = planFiles(ready, split), files = [], date = insp.date || todayISO(), base = sanitize(shortAddr(insp.address)) || 'Inspection';
  for (let fi = 0; fi < plans.length; fi++) {
    const pl = plans[fi], fc = plans.length;
    const cover = pl.photos.some(p => p.id === insp.coverId) ? insp.coverId : pl.photos[0].id;
    const job = {insp, brand, photos:pl.photos, title:pl.title, subtitle: fc > 1 ? `Roof Inspection Photos · File ${fi+1} of ${fc}` : '', perPage:state.settings.perPage,
      coverId:cover, fileNo:fi+1, fileCount:fc, totalPhotos:ready.length,
      fileName: fc > 1 ? `${base} - Roof Inspection Photos (${fi+1} of ${fc}).pdf` : `${base} - Roof Inspection Photos - ${date}.pdf`};
    const label = fc > 1 ? ` (file ${fi+1} of ${fc})` : '';
    let result = null, used = 0;
    for (let pass = startPass; pass <= 3; pass++) {
      const variants = new Map();
      for (let k = 0; k < pl.photos.length; k++) {
        if (b.cancel) throw Object.assign(new Error('cancel'), {cancel:true});
        const p = pl.photos[k], rec = state.imgs.get(p.id) || await DB.get('images', p.id);
        if (!rec || !rec.full) throw new Error('missing image');
        if (pass === 0) variants.set(p.id, {blob:rec.full, w:p.w, h:p.h});
        else { b.msg = `Shrinking photos to fit under ${state.settings.targetMB} MB… (pass ${pass} of 3)${label}`; b.frac = k / pl.photos.length; updateProgress();
          const s = await shrinkImage(rec.full, 1, SHRINK_PASSES[pass].long, SHRINK_PASSES[pass].q, false); variants.set(p.id, {blob:s.full, w:s.w, h:s.h}); }
      }
      const pages = 1 + Math.ceil(pl.photos.length / job.perPage);
      const est = [...variants.values()].reduce((a, v) => a + v.blob.size, 0) + brand.logo.length*0.75 + pages*1800 + 4000;
      if (est > target && pass < 3) continue;          // estimate too big: shrink more before building
      result = await writePdf(job, variants, (n, t) => { b.msg = `Building page ${n} of ${t}${label}`; b.frac = n / t; updateProgress(); }, () => b.cancel);
      used = pass;
      if (result.blob.size <= target) break;
    }
    files.push({name:job.fileName, blob:result.blob, pages:result.pages, passes:used, title:job.title});
  }
  return files;
}

/* ============================ location (Decision 19: button only, online only) ============================ */
function useLocation(){
  if (!navigator.geolocation) return toast("This phone can't share location — type the address");
  toast('Finding you…', {ms:15000});
  navigator.geolocation.getCurrentPosition(async pos => {
    const {latitude:lat, longitude:lon} = pos.coords; state.insp.lat = lat; state.insp.lon = lon; markChanged();
    if (!navigator.onLine) return toast('Offline — type the address');
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${lat}&lon=${lon}`, {headers:{'Accept':'application/json'}});
      const a = (await r.json()).address || {};
      const st = a.state === 'Tennessee' ? 'TN' : (a.state || '');
      const line = [[a.house_number, a.road].filter(Boolean).join(' '), a.city || a.town || a.village || a.hamlet || a.county, [st, a.postcode].filter(Boolean).join(' ')].filter(Boolean).join(', ');
      if (!line) throw new Error('none');
      const set = () => { state.insp.address = line; markChanged(); rerender(); };
      if (!String(state.insp.address||'').trim()) { set(); toast('Address filled — check the house number'); }
      else toast(`Found: ${line}`, {action:'Use it', fn:set, ms:8000});
    } catch(e) { toast("Couldn't look up the address — type it"); }
  }, err => toast(err.code === 1 ? 'Location is off for this site — type the address' : "Couldn't get your location — type the address"), {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
}

/* ============================ theme & boot ============================ */
function applyTheme(){
  const b = brandOf(state.insp), r = document.documentElement.style;
  r.setProperty('--acc', b.acc); r.setProperty('--accfg', b.accfg);
  document.body.classList.toggle('sun', !!state.settings.sun);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = state.settings.sun ? '#ffffff' : '#000000';
}
function fatal(html){ state.fatal = true; $('#app').innerHTML = `<div class="fatal"><h1 class="big">roof snap</h1>${html}</div>`; }
async function probeOrientation(){ try { const {img, url} = await loadImg(dataURLtoBlob(ORIENT_PROBE)); AUTO_ORIENT = img.naturalWidth === 1 && img.naturalHeight === 2; URL.revokeObjectURL(url); } catch(e) { AUTO_ORIENT = true; } }
function tabLock(){
  if (!navigator.locks || !navigator.locks.request) return Promise.resolve(true);
  return new Promise(res => { navigator.locks.request('roofsnap-open', {ifAvailable:true}, lock => { res(!!lock); if (lock) return new Promise(() => {}); }).catch(() => res(true)); });
}
async function boot(){
  if (!window.Promise || !window.Blob || !window.URL || !document.createElement('canvas').getContext || !window.fetch) return fatal("<p>Please update your phone's browser to use Roof Snap.</p>");
  try { await DB.open(); await DB.get('kv', 'settings'); } catch(e) { DB.useMemory(); state.privateMode = true; }
  if (!await tabLock()) return fatal('<p style="font-size:20px">Roof Snap is open in another tab — use that one.</p><p class="mute">Two copies at once could mix up your photos. You can close this tab.</p>');
  await probeOrientation();
  try { const s = await DB.get('kv', 'settings'); if (s) state.settings = {...DEFAULT_SETTINGS, ...s}; } catch(e) {}
  applyTheme();
  try { const days = state.settings.keepDays; if (days > 0) for (const i of await DB.all('insp')) if (i.status === 'finished' && i.finishedAt && Date.now() - i.finishedAt > days*864e5) await purgeInspection(i.id); } catch(e) {}
  try { if (await DB.get('kv', 'building')) { state.lastBuildFailed = true; await DB.del('kv', 'building'); } } catch(e) {}
  if (state.settings.currentId) {
    try { await loadInspection(state.settings.currentId); toast(`Picked up ${shortAddr(state.insp.address) || 'your inspection'}`); }
    catch(e) { console.warn(e); setCurrent(null, []); toast("Couldn't load last inspection. Anything saved is kept in Past inspections — start fresh.", {ms:6000}); }
  }
  await refreshPastCount(); applyTheme();
  const r = route();
  if (r.name !== 'home' && r.name !== 'gen' && r.name !== 'done') { const h = location.hash; history.replaceState({root:true}, '', '#/'); history.pushState(null, '', h); }
  else history.replaceState({root:true}, '', '#/');
  render();
}
window.addEventListener('unhandledrejection', e => { if (isQuota(e.reason)) { e.preventDefault(); storageFull(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && state.insp) DB.put('insp', state.insp).catch(() => {}); });
boot();
</script>
